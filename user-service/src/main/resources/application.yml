server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Override secrets with environment variables outside local development
jwt:
  secret: ${JWT_SECRET:RecurringFlexSecretKeyForJWTAuthenticationMustBe256Bits}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  issuer: recurringflex-user-service

# Shared with the API Gateway; requests without it are rejected
internal:
  secret: ${INTERNAL_SECRET:RecurringFlexInternalGatewaySecretChangeMe}

# Initial admin account (self-registration only creates USER accounts)
admin:
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@recurringflex.com}
  password: ${ADMIN_PASSWORD:Admin@12345}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
